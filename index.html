<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo URL</title>
<style>
  :root{
    --bg:#0d0f12;
    --panel:#16191d;
    --line:#262a30;
    --text:#e8eaed;
    --sub:#8a9099;
    --accent:#ffb020;
    --accent-dim:#3a2e10;
    --ok:#3ddc84;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .wrap{width:100%; max-width:420px;}

  /* ---- Upload state ---- */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:18px;
    background:var(--panel);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop:active{background:#1b1f24;}
  .drop svg{width:56px;height:56px;color:var(--sub);}
  input[type=file]{display:none;}

  .spinner{
    display:none;
    width:34px;height:34px;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  .spinner.show{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Result state ---- */
  .result{display:none;}
  .result.show{display:flex; flex-direction:column; align-items:center;}

  .photo-frame{
    width:100%;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--panel);
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-frame img{
    width:100%;
    height:auto;
    display:block;
    max-height:60vh;
    object-fit:contain;
  }

  .btn-row{
    display:flex;
    gap:12px;
    width:100%;
  }
  .btn{
    flex:1;
    aspect-ratio:1;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease, border-color .15s ease;
    color:var(--text);
  }
  .btn:active{transform:scale(0.94);}
  .btn svg{width:24px;height:24px;}

  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1300;
  }
  .btn-primary.done{
    background:var(--ok);
    border-color:var(--ok);
    color:#04220f;
  }

  .again{
    margin-top:18px;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--sub);
  }
  .again:active{transform:scale(0.92);}
  .again svg{width:18px;height:18px;}

  .empty{display:none; text-align:center; color:var(--sub);}
  .empty.show{display:block;}
  .empty svg{width:48px;height:48px; opacity:.4; margin-bottom:10px;}
</style>
</head>
<body>

<div class="wrap">

  <label class="drop" id="dropZone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" id="dropIcon">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <circle cx="8.5" cy="10" r="1.5"/>
      <path d="M21 15l-5-5-9 9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="spinner" id="spinner"></div>
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <div class="result" id="result">
    <div class="photo-frame">
      <img id="previewImg" alt="">
    </div>
    <div class="btn-row">
      <div class="btn btn-primary" id="copyBtn" title="Copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
      </div>
      <div class="btn" id="openBtn" title="Open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 3h6v6M10 14L21 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="btn" id="shareBtn" title="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="again" id="againBtn" title="New">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16m0 5v-5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="empty" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/></svg>
  </div>

</div>

<script>
const MAX_WIDTH = 450;
const MAX_QUALITY = 0.92;
const MIN_QUALITY = 0.05;
const MIN_WIDTH = 120;
const TARGET_LEN = 15000;
const BASE_URL = 'https://radifwith.github.io/Photo-to-url-free/';

const dropZone   = document.getElementById('dropZone');
const dropIcon   = document.getElementById('dropIcon');
const spinner    = document.getElementById('spinner');
const fileInput  = document.getElementById('fileInput');
const result     = document.getElementById('result');
const previewImg = document.getElementById('previewImg');
const copyBtn    = document.getElementById('copyBtn');
const openBtn    = document.getElementById('openBtn');
const shareBtn   = document.getElementById('shareBtn');
const againBtn   = document.getElementById('againBtn');
const emptyState = document.getElementById('emptyState');

let currentUrl = '';

// ---------- VIEW MODE: if URL has #data:image..., show that photo directly ----------
function tryLoadFromHash() {
  const hash = window.location.hash;
  if (hash && hash.length > 1) {
    const dataUrl = decodeURIComponent(hash.substring(1));
    if (dataUrl.startsWith('data:image/')) {
      dropZone.style.display = 'none';
      previewImg.src = dataUrl;
      currentUrl = window.location.href;
      result.classList.add('show');
      return true;
    } else {
      dropZone.style.display = 'none';
      emptyState.classList.add('show');
      return true;
    }
  }
  return false;
}

if (!tryLoadFromHash()) {
  // ---------- UPLOAD MODE ----------
  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });
}

function buildUrl(img, width, quality) {
  const height = Math.round(img.height * (width / img.width));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, width, height);
  const dataUrl = canvas.toDataURL('image/jpeg', quality);
  const fullUrl = BASE_URL + '#' + encodeURIComponent(dataUrl);
  return { dataUrl, fullUrl, width, height, quality };
}

// Binary-search the highest quality (at a given width) that still fits under TARGET_LEN.
function bestQualityAtWidth(img, width) {
  let lo = MIN_QUALITY, hi = MAX_QUALITY;
  let best = buildUrl(img, width, MIN_QUALITY);   // guaranteed smallest at this width
  if (best.fullUrl.length > TARGET_LEN) return best; // even min quality too big at this width

  for (let i = 0; i < 7; i++) {                    // ~7 steps is plenty of precision
    const mid = (lo + hi) / 2;
    const candidate = buildUrl(img, width, mid);
    if (candidate.fullUrl.length <= TARGET_LEN) {
      best = candidate;   // fits — try to push quality higher
      lo = mid;
    } else {
      hi = mid;           // too big — back off
    }
  }
  return best;
}

function compressUnderTarget(img) {
  let width = Math.min(img.width, MAX_WIDTH);
  let best = bestQualityAtWidth(img, width);

  // If even the lowest quality doesn't fit at this width, shrink width and retry.
  while (best.fullUrl.length > TARGET_LEN && width > MIN_WIDTH) {
    width = Math.max(MIN_WIDTH, Math.round(width * 0.85));
    best = bestQualityAtWidth(img, width);
  }

  return best;
}

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;

  dropIcon.style.display = 'none';
  spinner.classList.add('show');

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      setTimeout(() => {
        const { dataUrl, fullUrl } = compressUnderTarget(img);
        currentUrl = fullUrl;

        dropZone.style.display = 'none';
        previewImg.src = dataUrl;
        result.classList.add('show');
        copyBtn.classList.remove('done');
      }, 30);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(currentUrl).then(() => {
    copyBtn.classList.add('done');
    setTimeout(() => copyBtn.classList.remove('done'), 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = currentUrl;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyBtn.classList.add('done');
    setTimeout(() => copyBtn.classList.remove('done'), 1500);
  });
});

openBtn.addEventListener('click', () => {
  window.open(currentUrl, '_blank');
});

shareBtn.addEventListener('click', () => {
  if (navigator.share) {
    navigator.share({ url: currentUrl }).catch(() => {});
  } else {
    navigator.clipboard.writeText(currentUrl);
    copyBtn.classList.add('done');
    setTimeout(() => copyBtn.classList.remove('done'), 1500);
  }
});

againBtn.addEventListener('click', () => {
  window.location.href = BASE_URL;
});
</script>

</body>
</html>
