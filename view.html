<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo</title>
<style>
  :root{
    --bg:#0d0f12;
    --panel:#16191d;
    --line:#262a30;
    --text:#e8eaed;
    --sub:#8a9099;
    --accent:#ffb020;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .frame{
    max-width:480px;
    width:100%;
    text-align:center;
  }
  img{
    max-width:100%;
    max-height:78vh;
    border-radius:14px;
    border:1px solid var(--line);
    display:block;
    margin:0 auto;
  }
  .empty{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:40px 20px;
  }
  .empty h1{font-size:16px; margin:0 0 8px;}
  .empty p{color:var(--sub); font-size:13px; margin:0; line-height:1.5;}
  .empty a{color:var(--accent);}
  footer{
    margin-top:18px;
    font-family:var(--mono);
    font-size:10.5px;
    color:#4a4f57;
    letter-spacing:.04em;
  }
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="empty">
    <h1>Kono photo paoya jayni</h1>
    <p>Ei link-e valid photo data nei.<br>
    <a href="./index.html">Notun photo diye URL banan</a></p>
  </div>
</div>

<script>
  const hash = window.location.hash;
  const frame = document.getElementById('frame');

  if (hash && hash.length > 1) {
    const dataUrl = decodeURIComponent(hash.substring(1));
    if (dataUrl.startsWith('data:image/')) {
      frame.innerHTML = '<img src="' + dataUrl + '" alt="photo">' +
        '<footer>PHOTO-TO-URL</footer>';
    }
  }
</script>

</body>
</html>
